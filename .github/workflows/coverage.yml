# Coverage report for the test suite: `moon test --enable-coverage` →
# Coveralls, plus the summary on the run page.
#
# `continue-on-error` is deliberate: coverage is a report, not a gate. A
# Coveralls outage or a rejected upload must never block a merge.
#
# `secrets.GITHUB_TOKEN` is used as the Coveralls repo token; it needs no
# third-party signup beyond enabling the repo on coveralls.io and is available
# even for pull requests from forks.

name: coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    # Tests pull the database images on a cold cache.
    timeout-minutes: 45
    env:
      MOON_COVE_REPORT_ENABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Pull test images in parallel
        run: |
          set -euo pipefail
          pids=()
          for image in postgres:16-alpine mysql:8.4 adobe/s3mock:3.9.1 hashicorp/http-echo:1.0 alpine:3.21 testcontainers/ryuk:0.14.0; do
            docker pull "$image" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

      - name: moon test
        run: moon test --target native --enable-coverage --no-parallelize

      - name: coverage report
        run: |
          moon coverage report -f summary > coverage_summary.txt
          cat coverage_summary.txt >> "$GITHUB_STEP_SUMMARY"
          # `-o` is ignored on the send path: the tool writes its own
          # temporary coverage.json and deletes it after the upload.
          moon coverage report \
            -f coveralls \
            --service-name github \
            --service-job-id "$GITHUB_RUN_NUMBER" \
            --service-pull-request "${{ github.event.number }}" \
            --send-to coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove leaked containers
        if: always()
        run: |
          ids="$(docker ps -aq --filter label=org.testcontainers.mbt=true)"
          if [ -n "$ids" ]; then
            docker rm -f $ids
          fi
