name: Release

# Publishing only. CI on the pushed commit is the verification gate; a
# published release asserts that the tag was already verified. The workflow
# checks the tag matches `moon.mod` and publishes to mooncakes.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to mooncakes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match moon.mod version ${version}" >&2
            exit 1
          fi

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "${HOME}/.moon/bin" >> "${GITHUB_PATH}"

      - name: Publish to mooncakes
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          set -euo pipefail
          moon version --all
          moon update
          username="$(sed -n 's/^name = "\([^/]*\)\/.*"/\1/p' moon.mod)"
          mkdir -p "${HOME}/.moon"
          printf '{"token":"%s","username":"%s"}' \
            "${MOONCAKES_TOKEN}" "${username}" > "${HOME}/.moon/credentials.json"
          moon publish
